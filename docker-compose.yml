# OpenHRM — self-hosted stack.
#
#   cp .env.example .env      # then set the three secrets it names
#   docker compose up -d
#   open http://localhost:3000
#
# Brings up the app, Postgres, Redis and S3-compatible object storage. Redis and
# MinIO are here because Phase 2 (payroll runs, report generation, document
# storage) needs them; nothing in Phase 1 will fail if you remove them.

name: openhrm

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # The app connects as `openhrm_app`, NOT as the postgres superuser —
      # that is what makes the row-level-security policies actually bite.
      # See docs/SECURITY.md.
      DATABASE_URL: postgres://openhrm_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@postgres:5432/openhrm?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/openhrm?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-openhrm}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-openhrm}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-openhrm-dev-secret}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-OpenHRM <no-reply@example.com>}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openhrm
      # Creates the restricted `openhrm_app` role on first boot.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openhrm"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default — the database should not be reachable from
    # outside the compose network. Uncomment only if you need a local GUI.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openhrm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openhrm-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
